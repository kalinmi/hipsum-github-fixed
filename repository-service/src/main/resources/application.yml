server:
  port: 8081

spring:
  application:
    name: repository-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.betvictor.repository.adapter.in.kafka.WordsProcessedMessage
        spring.json.trusted.packages: com.betvictor.repository.adapter.in.kafka
        spring.json.use.type.headers: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/betvictor}
    username: ${DB_USER:betvictor}
    password: ${DB_PASSWORD:betvictor}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  kafka:
    topic: words.processed
    consumer-concurrency: ${CONSUMER_CONCURRENCY:4}
    group-id: repository-service

logging:
  level:
    com.betvictor: INFO
